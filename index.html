<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议海报生成器 Pro | Hengsheng Team</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@400;600;700;900&family=Playfair+Display:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; background: linear-gradient(135deg, #0a0f1a 0%, #1a1a2e 100%); min-height: 100vh; color: #333; }

        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(26,26,46,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .loading-overlay.show { display: flex; }
        .loading-spinner { width: 50px; height: 50px; border: 4px solid #333; border-top-color: #d4af37; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #d4af37; margin-top: 20px; font-size: 16px; }

        .auth-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-box { background: #fff; padding: 50px 40px; border-radius: 20px; box-shadow: 0 25px 80px rgba(0,0,0,0.5); text-align: center; max-width: 420px; width: 100%; }
        .auth-box h1 { font-family: 'Montserrat', sans-serif; font-weight: 800; color: #1a1a2e; font-size: 24px; margin-bottom: 8px; }
        .auth-box .subtitle { font-family: 'Montserrat', sans-serif; color: #d4af37; font-weight: 600; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 35px; }
        .auth-tabs { display: flex; margin-bottom: 25px; border-radius: 12px; overflow: hidden; border: 2px solid #e8e8e8; }
        .auth-tab { flex: 1; padding: 12px; border: none; background: transparent; color: #888; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .auth-tab.active { background: linear-gradient(135deg, #d4af37, #f4d03f); color: #1a1a2e; }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .auth-error, .auth-success { padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 14px; display: none; }
        .auth-error.show { display: block; background: #fee; color: #c00; border: 1px solid #fcc; }
        .auth-success.show { display: block; background: #efe; color: #080; border: 1px solid #cfc; }
        .auth-box input { width: 100%; padding: 16px 20px; border: 2px solid #e8e8e8; border-radius: 12px; font-size: 16px; margin-bottom: 15px; }
        .auth-box input:focus { outline: none; border-color: #d4af37; }
        .auth-box button.auth-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #d4af37, #f4d03f); border: none; border-radius: 12px; color: #1a1a2e; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 15px; }
        .auth-box button.auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .auth-link { color: #d4af37; text-decoration: none; font-size: 14px; cursor: pointer; }

        .app-container { display: none; min-height: 100vh; }
        .app-header { background: linear-gradient(135deg, #d4af37, #f4d03f); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; position: sticky; top: 0; z-index: 100; }
        .app-header h1 { font-family: 'Montserrat', sans-serif; font-weight: 800; color: #1a1a2e; font-size: 16px; }
        .header-user { font-size: 13px; color: #1a1a2e; }
        .header-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .header-btn { padding: 8px 16px; border: 2px solid #1a1a2e; background: transparent; color: #1a1a2e; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .header-btn:hover { background: #1a1a2e; color: #d4af37; }
        .header-btn.logout-btn { border-color: #c00; color: #c00; }
        .header-btn.logout-btn:hover { background: #c00; color: #fff; }

        .main-content { display: flex; flex-wrap: wrap; padding: 20px; gap: 20px; max-width: 1600px; margin: 0 auto; }
        .form-section { flex: 1; min-width: 380px; max-width: 520px; background: #fff; border-radius: 20px; padding: 25px; box-shadow: 0 15px 50px rgba(0,0,0,0.3); max-height: calc(100vh - 100px); overflow-y: auto; }
        .form-section::-webkit-scrollbar { width: 6px; }
        .form-section::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 3px; }

        .tab-container { display: flex; gap: 4px; margin-bottom: 20px; background: #f5f5f5; padding: 4px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 10px 6px; border: none; background: transparent; color: #888; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600; }
        .tab-btn.active { background: #1a1a2e; color: #d4af37; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-section-title { font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; color: #1a1a2e; margin: 22px 0 12px 0; padding-bottom: 8px; border-bottom: 2px solid #d4af37; text-transform: uppercase; letter-spacing: 1px; }
        .form-section-title:first-child { margin-top: 0; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; font-size: 12px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 11px 14px; border: 2px solid #e8e8e8; border-radius: 10px; font-size: 14px; font-family: 'Noto Sans SC', sans-serif; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #d4af37; }
        .form-group textarea { resize: vertical; min-height: 65px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        .form-hint { font-size: 11px; color: #888; margin-top: 4px; }
        .auto-badge { background: #e3f2fd; color: #1976d2; padding: 2px 8px; border-radius: 10px; font-size: 9px; font-weight: 600; margin-left: 8px; }

        .quick-fill-section { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border: 2px solid #4caf50; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .quick-fill-section h4 { font-size: 13px; color: #2e7d32; margin-bottom: 10px; }
        .quick-fill-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .quick-fill-btn { padding: 8px 14px; background: #4caf50; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }

        .speaker-select-container { display: flex; gap: 8px; margin-bottom: 12px; }
        .speaker-select-container select { flex: 1; }
        .speaker-select-container button { padding: 11px 14px; background: #1a1a2e; color: #d4af37; border: none; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 600; }

        .photo-upload-area { width: 100%; height: 180px; border: 3px dashed #d4af37; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; background: linear-gradient(135deg, #fffbeb, #fff9e6); overflow: hidden; position: relative; }
        .photo-upload-area img { width: 100%; height: 100%; object-fit: contain; }
        .photo-upload-area .upload-text { text-align: center; color: #b8960c; font-weight: 600; }
        .photo-upload-area .upload-text span { display: block; font-size: 40px; margin-bottom: 8px; }

        .image-controls { background: #f8f9fa; border-radius: 12px; padding: 15px; margin-top: 12px; }
        .image-controls h5 { font-size: 12px; color: #333; margin-bottom: 12px; }
        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .control-item { display: flex; flex-direction: column; gap: 4px; }
        .control-item.full { grid-column: 1 / -1; }
        .control-item label { font-size: 11px; color: #666; display: flex; justify-content: space-between; }
        .control-item input[type="range"] { width: 100%; height: 6px; border-radius: 3px; background: #e0e0e0; -webkit-appearance: none; cursor: pointer; }
        .control-item input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #d4af37; cursor: pointer; }
        .image-action-btns { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
        .image-action-btn { flex: 1; min-width: 70px; padding: 8px; border: 2px solid #e0e0e0; background: #fff; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600; text-align: center; }
        .image-action-btn:hover { border-color: #d4af37; background: #fffbeb; }
        .image-action-btn.active { border-color: #d4af37; background: #d4af37; color: #1a1a2e; }
        .image-action-btn.removebg { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; }

        .ai-translate-section { background: linear-gradient(135deg, #e3f2fd, #bbdefb); border: 2px solid #2196f3; border-radius: 12px; padding: 12px; margin-top: 10px; }
        .ai-translate-btn { width: 100%; padding: 10px; background: #2196f3; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }

        .batch-export-section { background: linear-gradient(135deg, #fce4ec, #f8bbd9); border: 2px solid #e91e63; border-radius: 12px; padding: 15px; margin-top: 15px; }
        .batch-export-section h4 { font-size: 13px; color: #c2185b; margin-bottom: 10px; }
        .batch-options { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .batch-option { padding: 8px 12px; background: white; border: 2px solid #e91e63; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600; color: #c2185b; }
        .batch-option.selected { background: #e91e63; color: white; }
        .batch-export-btn { width: 100%; padding: 12px; background: #e91e63; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; }

        .preview-section { flex: 1; min-width: 400px; display: flex; flex-direction: column; align-items: center; }
        .preview-container { position: relative; width: 100%; max-width: 450px; }
        .poster-preview { width: 100%; aspect-ratio: 9/16; border-radius: 20px; overflow: hidden; box-shadow: 0 25px 80px rgba(0,0,0,0.5); position: relative; background: #1a1a2e; }

        /* 海报样式 - 居中对称布局 */
        .poster-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
        .poster-overlay { position: absolute; inset: 0; }
        .poster-content { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 6%; color: white; }

        .poster-header { text-align: center; margin-bottom: 4%; }
        .poster-badge { display: inline-block; padding: 1% 4%; border-radius: 25px; font-size: 2.5vmin; font-weight: 700; letter-spacing: 2px; }

        .poster-titles { text-align: center; margin-bottom: 4%; }
        .poster-main-title { font-family: 'Noto Serif SC', serif; font-size: 7vmin; font-weight: 900; line-height: 1.2; text-shadow: 2px 2px 15px rgba(0,0,0,0.5); }
        .poster-main-title-en { font-family: 'Oswald', sans-serif; font-size: 3vmin; font-weight: 600; letter-spacing: 4px; opacity: 0.9; margin-top: 1%; }
        .poster-subtitle { font-size: 3vmin; margin-top: 2%; opacity: 0.9; }
        .poster-subtitle-en { font-family: 'Montserrat', sans-serif; font-size: 2vmin; letter-spacing: 2px; opacity: 0.8; margin-top: 1%; }

        .poster-speaker { display: flex; align-items: center; gap: 5%; margin: auto 0; padding: 4% 0; }
        .speaker-photo-container { width: 38%; flex-shrink: 0; }
        .speaker-photo { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: center top; border-radius: 15px; box-shadow: 0 15px 50px rgba(0,0,0,0.5); background: linear-gradient(135deg, #d4af3740, #d4af3720); }
        .speaker-info { flex: 1; text-align: left; }
        .speaker-name-cn { font-family: 'Noto Serif SC', serif; font-size: 5.5vmin; font-weight: 900; margin-bottom: 1%; }
        .speaker-name-en { font-family: 'Playfair Display', serif; font-size: 2.8vmin; font-weight: 600; opacity: 0.9; margin-bottom: 3%; letter-spacing: 2px; }
        .speaker-title { font-size: 2.2vmin; opacity: 0.85; line-height: 1.6; }
        .speaker-achievements { list-style: none; font-size: 1.9vmin; opacity: 0.8; margin-top: 2%; }
        .speaker-achievements li { margin-bottom: 1%; padding-left: 4%; position: relative; }
        .speaker-achievements li::before { content: '✦'; position: absolute; left: 0; font-size: 1.5vmin; }

        .poster-meeting-info { margin-top: auto; padding: 4%; border-radius: 15px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); text-align: center; }
        .meeting-title { font-size: 2.8vmin; font-weight: 700; margin-bottom: 2%; letter-spacing: 1px; }
        .meeting-time { font-size: 2.5vmin; margin-bottom: 2%; }
        .meeting-time-zones { font-size: 2.2vmin; opacity: 0.9; }
        .meeting-platform { font-size: 2vmin; opacity: 0.8; margin-top: 2%; }

        .poster-footer { margin-top: 4%; text-align: center; padding-top: 3%; border-top: 1px solid rgba(255,255,255,0.2); }
        .poster-logo { font-family: 'Montserrat', sans-serif; font-size: 3vmin; font-weight: 800; letter-spacing: 4px; }
        .poster-tagline { font-size: 1.8vmin; opacity: 0.7; margin-top: 1%; }

        .action-buttons { display: flex; gap: 12px; margin-top: 25px; flex-wrap: wrap; justify-content: center; }
        .action-btn { padding: 14px 28px; border: none; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .action-btn.primary { background: linear-gradient(135deg, #d4af37, #f4d03f); color: #1a1a2e; }
        .action-btn.secondary { background: #1a1a2e; color: #d4af37; }

        .history-section { background: #fff; border-radius: 12px; padding: 15px; margin-top: 20px; max-height: 250px; overflow-y: auto; width: 100%; max-width: 450px; }
        .history-section h4 { font-size: 13px; color: #1a1a2e; margin-bottom: 12px; }
        .history-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: #f8f9fa; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .history-item:hover { background: #e8e8e8; }
        .history-thumb { width: 40px; height: 70px; background: #1a1a2e; border-radius: 4px; }
        .history-info { flex: 1; }
        .history-title { font-size: 12px; font-weight: 600; }
        .history-date { font-size: 10px; color: #888; }
        .history-delete { padding: 5px 10px; background: #fee; color: #c00; border: none; border-radius: 5px; cursor: pointer; font-size: 11px; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #fff; border-radius: 20px; padding: 30px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 18px; color: #1a1a2e; }
        .modal-close { width: 36px; height: 36px; border: none; background: #f0f0f0; border-radius: 50%; cursor: pointer; font-size: 18px; }

        .speaker-library-list { max-height: 400px; overflow-y: auto; }
        .speaker-library-item { display: flex; align-items: center; gap: 15px; padding: 15px; background: #f8f9fa; border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
        .speaker-library-item:hover { background: #e8e8e8; }
        .speaker-library-photo { width: 60px; height: 80px; border-radius: 8px; object-fit: cover; background: #ddd; }
        .speaker-library-info { flex: 1; }
        .speaker-library-name { font-weight: 700; color: #1a1a2e; }
        .speaker-library-title { font-size: 12px; color: #666; }
        .speaker-library-actions { display: flex; gap: 8px; }
        .speaker-library-actions button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; }
        .speaker-library-actions .use-btn { background: #d4af37; color: #1a1a2e; }
        .speaker-library-actions .delete-btn { background: #fee; color: #c00; }

        .template-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
        .template-btn { aspect-ratio: 9/16; border: 3px solid transparent; border-radius: 8px; cursor: pointer; position: relative; overflow: hidden; }
        .template-btn.active { border-color: #d4af37; }
        .template-btn span { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: white; font-size: 9px; padding: 3px; text-align: center; }

        .color-schemes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .color-scheme-btn { width: 45px; height: 45px; border: 3px solid transparent; border-radius: 8px; cursor: pointer; position: relative; overflow: hidden; }
        .color-scheme-btn.active { border-color: #1a1a2e; }
        .color-scheme-btn::before, .color-scheme-btn::after { content: ''; position: absolute; width: 50%; height: 100%; top: 0; }
        .color-scheme-btn::before { left: 0; }
        .color-scheme-btn::after { right: 0; }
        .color-scheme-btn[data-scheme="1"]::before { background: #1a1a2e; }
        .color-scheme-btn[data-scheme="1"]::after { background: #d4af37; }
        .color-scheme-btn[data-scheme="2"]::before { background: #0d2137; }
        .color-scheme-btn[data-scheme="2"]::after { background: #c9a227; }
        .color-scheme-btn[data-scheme="3"]::before { background: #1a0a2e; }
        .color-scheme-btn[data-scheme="3"]::after { background: #9b59b6; }
        .color-scheme-btn[data-scheme="4"]::before { background: #0a1a2e; }
        .color-scheme-btn[data-scheme="4"]::after { background: #3498db; }
        .color-scheme-btn[data-scheme="5"]::before { background: #1a2e1a; }
        .color-scheme-btn[data-scheme="5"]::after { background: #27ae60; }
        .color-scheme-btn[data-scheme="6"]::before { background: #2e1a1a; }
        .color-scheme-btn[data-scheme="6"]::after { background: #e74c3c; }

        .dynamic-items { margin-top: 10px; }
        .dynamic-item { display: flex; gap: 8px; margin-bottom: 8px; }
        .dynamic-item input { flex: 1; }
        .dynamic-item button { padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; background: #fee; color: #c00; }
        .add-item-btn { padding: 10px 16px; background: #e3f2fd; color: #1976d2; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 8px; }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: #fff; padding: 16px 32px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        .toast.success { background: #27ae60; }
        .toast.error { background: #c0392b; }

        @media (max-width: 900px) {
            .main-content { flex-direction: column; align-items: center; }
            .form-section, .preview-section { max-width: 100%; min-width: auto; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">加载中...</div>
    </div>

    <div class="auth-screen" id="authScreen">
        <div class="auth-box">
            <h1>会议海报生成器</h1>
            <p class="subtitle">Hengsheng Team</p>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">登录</button>
                <button class="auth-tab" onclick="switchAuthTab('register')">注册</button>
            </div>
            <div class="auth-error" id="authError"></div>
            <div class="auth-success" id="authSuccess"></div>
            <div class="auth-form active" id="loginForm">
                <input type="email" id="loginEmail" placeholder="邮箱地址">
                <input type="password" id="loginPassword" placeholder="密码" onkeypress="if(event.key==='Enter')handleLogin()">
                <button class="auth-btn" id="loginBtn" onclick="handleLogin()">登录</button>
                <a class="auth-link" onclick="showForgotPassword()">忘记密码？</a>
            </div>
            <div class="auth-form" id="registerForm">
                <input type="email" id="registerEmail" placeholder="邮箱地址">
                <input type="password" id="registerPassword" placeholder="密码（至少6位）">
                <input type="password" id="registerConfirmPassword" placeholder="确认密码">
                <button class="auth-btn" id="registerBtn" onclick="handleRegister()">注册</button>
            </div>
            <div class="auth-form" id="forgotForm">
                <input type="email" id="forgotEmail" placeholder="邮箱地址">
                <button class="auth-btn" onclick="handleForgotPassword()">发送重置邮件</button>
                <a class="auth-link" onclick="switchAuthTab('login')">返回登录</a>
            </div>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <header class="app-header">
            <h1>🎨 会议海报生成器</h1>
            <div class="header-user"><span id="userEmail"></span></div>
            <div class="header-buttons">
                <button class="header-btn" onclick="openSpeakerLibrary()">👥 讲师库</button>
                <button class="header-btn" onclick="openTemplateLibrary()">📑 模板库</button>
                <button class="header-btn" onclick="saveAsTemplate()">💾 保存</button>
                <button class="header-btn logout-btn" onclick="handleLogout()">退出</button>
            </div>
        </header>

        <div class="main-content">
            <div class="form-section">

        function translateName(name) {
            if (!name || !/[\u4e00-\u9fa5]/.test(name)) return '';
            let result = [], i = 0;
            if (name.length >= 2 && compoundSurnames[name.substring(0, 2)]) { result.push(compoundSurnames[name.substring(0, 2)]); i = 2; }
            for (; i < name.length; i++) { if (pinyinMap[name[i]]) result.push(pinyinMap[name[i]]); }
            return result.join(' ');
        }

        function translateTextLocal(text) {
            if (!text || !/[\u4e00-\u9fa5]/.test(text)) return '';
            let words = [], remaining = text;
            const keys = Object.keys(translationDict).sort((a, b) => b.length - a.length);
            while (remaining.length > 0 && /[\u4e00-\u9fa5]/.test(remaining)) {
                let found = false;
                for (let cn of keys) { if (remaining.startsWith(cn)) { words.push(translationDict[cn]); remaining = remaining.substring(cn.length); found = true; break; } }
                if (!found) remaining = remaining.substring(1);
            }
            return words.join(' ');
        }

        async function translateTextOnline(text) {
            if (!text || !/[\u4e00-\u9fa5]/.test(text)) return '';
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh-CN|en`);
                const data = await res.json();
                if (data.responseStatus === 200) return data.responseData.translatedText.toUpperCase();
            } catch (e) {}
            return translateTextLocal(text);
        }

            updatePreview();
            showToast('翻译完成！', 'success');
            btn.disabled = false; btn.textContent = '🌐 一键智能翻译';

            if (!state.photo) { showToast('请先上传照片', 'error'); return; }
            showLoading('AI智能抠图中...');
            try {
                const blob = await fetch(state.photo).then(r => r.blob());
                const formData = new FormData();
                formData.append('image_file', blob);
                formData.append('size', 'auto');
                const res = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST', headers: { 'X-Api-Key': REMOVEBG_API_KEY }, body: formData
                });
                if (!res.ok) throw new Error('抠图失败');
                const resultBlob = await res.blob();
                const reader = new FileReader();
                reader.onload = function(e) {
                    state.photo = e.target.result;
                    document.getElementById('photoPreviewImg').src = e.target.result;
                    updatePreview();
                    hideLoading();
                    showToast('抠图成功！', 'success');
                };

                }
                updatePreview();
                showToast('已加载讲师', 'success');
            } catch (e) { console.error(e); }
        }

        async function loadHistory() {
            if (!currentUser) return;
            const list = document.getElementById('historyList');
            try {
                const snap = await db.collection('users').doc(currentUser.uid).collection('history').orderBy('createdAt', 'desc').limit(5).get();
                if (snap.empty) { list.innerHTML = '<div style="text-align:center;color:#888;font-size:12px;">暂无记录</div>'; return; }
                let html = '';
                snap.forEach(doc => {
                    const d = doc.data();
                    html += `<div class="history-item" onclick="loadFromHistory('${doc.id}')">
                        <div class="history-thumb"></div>
                        <div class="history-info"><div class="history-title">${d.mainTitle || '未命名'}</div><div class="history-date">${d.createdAt ? new Date(d.createdAt.toDate()).toLocaleDateString('zh-CN') : ''}</div></div>
                    </div>`;
                });
                list.innerHTML = html;
            } catch (e) { list.innerHTML = '<div style="text-align:center;color:#888;font-size:12px;">加载失败</div>'; }
        }

        async function saveToHistory() {
            if (!currentUser) return;
            const achievements = [], points = [];
            document.querySelectorAll('#achievementsList input').forEach(i => { if (i.value.trim()) achievements.push(i.value.trim()); });
            document.querySelectorAll('#pointsList input').forEach(i => { if (i.value.trim()) points.push(i.value.trim()); });
            try {
                await db.collection('users').doc(currentUser.uid).collection('history').add({
                    mainTitle: document.getElementById('mainTitle').value,
                    speaker: { nameCn: document.getElementById('speakerName').value, nameEn: document.getElementById('speakerNameEn').value, title: document.getElementById('speakerTitle').value, achievements },
                    content: { badge: document.getElementById('badge').value, mainTitleEn: document.getElementById('mainTitleEn').value, subtitle: document.getElementById('subtitle').value, points },
                    design: { template: state.template, colorScheme: state.colorScheme },
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                await loadHistory();
            } catch (e) {}
        }

        async function loadFromHistory(docId) {
            if (!currentUser) return;
            try {
                const doc = await db.collection('users').doc(currentUser.uid).collection('history').doc(docId).get();
                if (!doc.exists) return;
                const d = doc.data();
                if (d.mainTitle) document.getElementById('mainTitle').value = d.mainTitle;
                if (d.speaker) {
                    document.getElementById('speakerName').value = d.speaker.nameCn || '';
                    document.getElementById('speakerNameEn').value = d.speaker.nameEn || '';
                    document.getElementById('speakerTitle').value = d.speaker.title || '';
                    document.getElementById('achievementsList').innerHTML = '';
                    (d.speaker.achievements || []).forEach(a => addAchievement(a));
                }
                if (d.content) {
                    document.getElementById('badge').value = d.content.badge || '';
                    document.getElementById('mainTitleEn').value = d.content.mainTitleEn || '';
                    document.getElementById('subtitle').value = d.content.subtitle || '';
                    document.getElementById('pointsList').innerHTML = '';
                    (d.content.points || []).forEach(p => addPoint(p));
                }
                if (d.design) { selectTemplate(d.design.template || 1); selectColorScheme(d.design.colorScheme || 1); }
                updatePreview();
                showToast('已加载', 'success');
            } catch (e) {}
        }

        async function saveAsTemplate() {
            if (!currentUser) { showToast('请先登录', 'error'); return; }
            const name = prompt('模板名称：');
            if (!name) return;
            const achievements = [], points = [];
            document.querySelectorAll('#achievementsList input').forEach(i => { if (i.value.trim()) achievements.push(i.value.trim()); });
            document.querySelectorAll('#pointsList input').forEach(i => { if (i.value.trim()) points.push(i.value.trim()); });
            try {
                await db.collection('users').doc(currentUser.uid).collection('templates').add({
                    name, speaker: { nameCn: document.getElementById('speakerName').value, nameEn: document.getElementById('speakerNameEn').value, title: document.getElementById('speakerTitle').value, achievements, photo: state.photo },
                    content: { badge: document.getElementById('badge').value, mainTitle: document.getElementById('mainTitle').value, mainTitleEn: document.getElementById('mainTitleEn').value, subtitle: document.getElementById('subtitle').value, points },
                    design: { template: state.template, colorScheme: state.colorScheme },
                    brand: { name: document.getElementById('brandName').value, tagline: document.getElementById('brandTagline').value },
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showToast('模板已保存', 'success');
            } catch (e) { showToast('保存失败', 'error'); }
        }

        // UI Functions
        function switchTab(name) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
        }

        function quickFill(type) {
            if (defaultSpeakers[type]) {
                const s = defaultSpeakers[type];
                document.getElementById('speakerName').value = s.name;
                document.getElementById('speakerNameEn').value = s.nameEn;
                document.getElementById('speakerTitle').value = s.title;
                document.getElementById('achievementsList').innerHTML = '';
                s.achievements.forEach(a => addAchievement(a));
                updatePreview();
            }
        }

        function addAchievement(val = '') {
            const c = document.getElementById('achievementsList');
            const d = document.createElement('div');
            d.className = 'dynamic-item';
            d.innerHTML = `<input type="text" placeholder="成就${c.children.length + 1}" value="${val}" oninput="updatePreview()"><button onclick="this.parentElement.remove();updatePreview()">✕</button>`;
            c.appendChild(d);
        }

        function addPoint(val = '') {
            const c = document.getElementById('pointsList');
            const d = document.createElement('div');
            d.className = 'dynamic-item';
            d.innerHTML = `<input type="text" placeholder="要点${c.children.length + 1}" value="${val}" oninput="updatePreview()"><button onclick="this.parentElement.remove();updatePreview()">✕</button>`;
            c.appendChild(d);
        }

        function handlePhotoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                state.photo = ev.target.result;
                const img = document.getElementById('photoPreviewImg');
                img.src = ev.target.result;
                img.style.display = 'block';
                document.getElementById('photoPlaceholder').style.display = 'none';
                updatePreview();
            };
            reader.readAsDataURL(file);
        }

        function updateImageControls() {
            state.photoPosition.x = document.getElementById('photoPositionX').value;
            state.photoPosition.y = document.getElementById('photoPositionY').value;
            state.photoScale = document.getElementById('photoScale').value;
            state.photoBrightness = document.getElementById('photoBrightness').value;
            document.getElementById('posXVal').textContent = state.photoPosition.x + '%';
            document.getElementById('posYVal').textContent = state.photoPosition.y + '%';
            document.getElementById('scaleVal').textContent = state.photoScale + '%';
            document.getElementById('brightnessVal').textContent = state.photoBrightness + '%';
            updatePreview();
        }

        function resetImageControls() {
            document.getElementById('photoPositionX').value = 50;
            document.getElementById('photoPositionY').value = 20;
            document.getElementById('photoScale').value = 100;
            document.getElementById('photoBrightness').value = 100;
            state.flipH = false;
            document.getElementById('flipHBtn').classList.remove('active');
            updateImageControls();
        }

        function toggleFlip(dir) {
            state.flipH = !state.flipH;
            document.getElementById('flipHBtn').classList.toggle('active', state.flipH);
            updatePreview();
        }

        function selectTemplate(n) {
            state.template = n;
            document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.template-btn[data-template="${n}"]`)?.classList.add('active');
            updatePreview();
        }

        function selectColorScheme(n) {
            state.colorScheme = n;
            document.querySelectorAll('.color-scheme-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.color-scheme-btn[data-scheme="${n}"]`)?.classList.add('active');
            updatePreview();
        }

        function onChineseNameInput() {
            const cn = document.getElementById('speakerName').value;
            const en = document.getElementById('speakerNameEn');
            if (cn && !en.dataset.userEdited) { const t = translateName(cn); if (t) en.value = t; }
            updatePreview();
        }

        function onMainTitleInput() {
            const cn = document.getElementById('mainTitle').value;
            const en = document.getElementById('mainTitleEn');
            if (cn && !en.dataset.userEdited) { const t = translateTextLocal(cn); if (t) en.value = t; }
            updatePreview();
        }

        // Preview Update - 居中对称布局
        function updatePreview() {
            const scheme = colorSchemes[state.colorScheme];
            const bg = backgrounds[state.template - 1] || backgrounds[0];
            const poster = document.getElementById('posterPreview');

            const speakerName = document.getElementById('speakerName').value || '讲师姓名';
            const speakerNameEn = document.getElementById('speakerNameEn').value || 'Speaker Name';
            const speakerTitle = document.getElementById('speakerTitle').value || '资深行业导师';
            const badge = document.getElementById('badge').value || '专业培训';
            const mainTitle = document.getElementById('mainTitle').value || '成功宝典';
            const mainTitleEn = document.getElementById('mainTitleEn').value || 'SUCCESS SECRETS';
            const subtitle = document.getElementById('subtitle').value || '';
            const brandName = document.getElementById('brandName').value || 'HENGSHENG';
            const brandTagline = document.getElementById('brandTagline').value || '共创财富 · 成就未来';

            const achievements = [];
            document.querySelectorAll('#achievementsList input').forEach(i => { if (i.value.trim()) achievements.push(i.value.trim()); });

            // Time formatting
            const meetingDate = document.getElementById('meetingDate').value;
            const meetingTime = document.getElementById('meetingTime').value;
            let dateStr = '', timeStr = '';
            if (meetingDate && meetingTime) {
                const dt = new Date(meetingDate + 'T' + meetingTime);
                const options = { month: 'long', day: 'numeric', weekday: 'long' };
                dateStr = dt.toLocaleDateString('zh-CN', options);
                const caTime = dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                const bjHour = (dt.getHours() + 16) % 24;
                const nyHour = (dt.getHours() + 3) % 24;
                timeStr = `加州 ${caTime} | 北京 ${bjHour}:${String(dt.getMinutes()).padStart(2,'0')} | 纽约 ${nyHour > 12 ? nyHour-12 : nyHour}:${String(dt.getMinutes()).padStart(2,'0')} ${nyHour >= 12 ? 'PM' : 'AM'}`;
            }

            // Photo styles
            let photoTransform = `scale(${state.photoScale/100})`;
            if (state.flipH) photoTransform += ' scaleX(-1)';
            const photoFilter = `brightness(${state.photoBrightness}%)`;
            const photoStyle = state.photo ?
                `background-image:url(${state.photo});background-size:cover;background-position:${state.photoPosition.x}% ${state.photoPosition.y}%;transform:${photoTransform};filter:${photoFilter};` :
                `background:linear-gradient(135deg, ${scheme.accent}40, ${scheme.accent}20);display:flex;align-items:center;justify-content:center;font-size:5vmin;`;

            poster.innerHTML = `
                <div class="poster-bg" style="background:${bg.gradient};"></div>
                <div class="poster-overlay" style="background:linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.2) 70%, rgba(0,0,0,0.5) 100%);"></div>
                <div class="poster-content">
                    <div class="poster-header">
                        <div class="poster-badge" style="background:${scheme.accent};color:${scheme.primary};">${badge}</div>
                    </div>

                    <div class="poster-titles">
                        <div class="poster-main-title" style="color:${scheme.accent};">${mainTitle}</div>
                        <div class="poster-main-title-en">${mainTitleEn}</div>
                        ${subtitle ? `<div class="poster-subtitle">${subtitle}</div>` : ''}
                    </div>

                    <div class="poster-speaker">
                        <div class="speaker-photo-container">
                            <div class="speaker-photo" style="${photoStyle}">${state.photo ? '' : '📷'}</div>
                        </div>
                        <div class="speaker-info">
                            <div class="speaker-name-cn" style="color:${scheme.accent};">${speakerName}</div>
                            <div class="speaker-name-en">${speakerNameEn}</div>
                            <div class="speaker-title">${speakerTitle}</div>
                            ${achievements.length ? `<ul class="speaker-achievements">${achievements.map(a => `<li>${a}</li>`).join('')}</ul>` : ''}
                        </div>
                    </div>

                    <div class="poster-meeting-info">
                        ${dateStr ? `<div class="meeting-title">📅 ${dateStr}</div>` : ''}
                        ${timeStr ? `<div class="meeting-time-zones">${timeStr}</div>` : ''}
                        <div class="meeting-platform">Zoom 在线会议</div>
                    </div>

                    <div class="poster-footer">
                        <div class="poster-logo" style="color:${scheme.accent};">${brandName}</div>
                        <div class="poster-tagline">${brandTagline}</div>
                    </div>
                </div>
            `;
        }

        // Export Functions
        async function downloadPoster(w = 1080, h = 1920) {
            showLoading('生成高清海报...');
            try {
                const poster = document.getElementById('posterPreview');
                const canvas = await html2canvas(poster, { scale: 3, useCORS: true, allowTaint: true, backgroundColor: null });
                const resized = document.createElement('canvas');
                resized.width = w; resized.height = h;
                resized.getContext('2d').drawImage(canvas, 0, 0, w, h);
                const link = document.createElement('a');
                link.download = `海报_${document.getElementById('mainTitle').value || 'poster'}_${w}x${h}.png`;
                link.href = resized.toDataURL('image/png');
                link.click();
                hideLoading();
                showToast('下载成功！', 'success');
                await saveToHistory();
            } catch (e) { hideLoading(); showToast('下载失败', 'error'); }
        }

        async function batchExport() {
            const selected = document.querySelectorAll('.batch-option.selected');
            if (!selected.length) { showToast('请选择尺寸', 'error'); return; }
            showLoading('批量导出中...');
            for (let opt of selected) {
                const [w, h] = opt.dataset.size.split('x').map(Number);
                await downloadPoster(w, h);
                await new Promise(r => setTimeout(r, 500));
            }
            hideLoading();
        }

        function copyNotification() {
            const text = `📢 培训预告\n\n【${document.getElementById('mainTitle').value || '成功宝典'}】\n\n🎤 主讲：${document.getElementById('speakerName').value || '讲师'}\n📅 ${document.getElementById('meetingDate').value} ${document.getElementById('meetingTime').value} (加州时间)\n🔗 ${document.getElementById('zoomLink').value || 'Zoom在线会议'}\n\n期待您的参与！🎉`;
            navigator.clipboard.writeText(text).then(() => showToast('已复制', 'success')).catch(() => showToast('复制失败', 'error'));
        }

        // Modals
        async function openSpeakerLibrary() {
            document.getElementById('speakerModal').classList.add('show');
            const list = document.getElementById('speakerLibraryList');
            let html = '';
            Object.entries(defaultSpeakers).forEach(([id, s]) => {
                html += `<div class="speaker-library-item" onclick="quickFill('${id}');closeModal('speakerModal');"><div class="speaker-library-photo" style="background:#d4af37;"></div><div class="speaker-library-info"><div class="speaker-library-name">${s.name}</div><div class="speaker-library-title">${s.title.substring(0,30)}...</div></div></div>`;
            });
            if (currentUser) {
                const snap = await db.collection('users').doc(currentUser.uid).collection('speakers').get();
                snap.forEach(doc => {
                    const d = doc.data();
                    html += `<div class="speaker-library-item" onclick="loadSpeakerFromCloud('${doc.id}');closeModal('speakerModal');"><div class="speaker-library-photo" style="${d.photo ? 'background-image:url('+d.photo+');background-size:cover;' : 'background:#ddd;'}"></div><div class="speaker-library-info"><div class="speaker-library-name">${d.name}</div><div class="speaker-library-title">${(d.title||'').substring(0,30)}</div></div></div>`;
                });
            }
            list.innerHTML = html || '<div style="padding:20px;text-align:center;color:#888;">暂无讲师</div>';
        }

        async function openTemplateLibrary() {
            document.getElementById('templateModal').classList.add('show');
            const list = document.getElementById('templateLibraryList');
            if (!currentUser) { list.innerHTML = '<div style="padding:20px;text-align:center;color:#888;">请先登录</div>'; return; }
            const snap = await db.collection('users').doc(currentUser.uid).collection('templates').orderBy('createdAt', 'desc').get();
            let html = '';
            snap.forEach(doc => {
                const d = doc.data();
                html += `<div class="speaker-library-item" onclick="loadTemplateFromDb('${doc.id}');closeModal('templateModal');"><div class="speaker-library-photo" style="background:linear-gradient(135deg,#1a1a2e,#d4af37);"></div><div class="speaker-library-info"><div class="speaker-library-name">${d.name}</div><div class="speaker-library-title">${d.content?.mainTitle || ''}</div></div></div>`;
            });
            list.innerHTML = html || '<div style="padding:20px;text-align:center;color:#888;">暂无模板</div>';
        }

        async function loadTemplateFromDb(docId) {
            if (!currentUser) return;
            const doc = await db.collection('users').doc(currentUser.uid).collection('templates').doc(docId).get();
            if (!doc.exists) return;
            const d = doc.data();
            if (d.speaker) {
                document.getElementById('speakerName').value = d.speaker.nameCn || '';
                document.getElementById('speakerNameEn').value = d.speaker.nameEn || '';
                document.getElementById('speakerTitle').value = d.speaker.title || '';
                document.getElementById('achievementsList').innerHTML = '';
                (d.speaker.achievements || []).forEach(a => addAchievement(a));
                if (d.speaker.photo) { state.photo = d.speaker.photo; document.getElementById('photoPreviewImg').src = d.speaker.photo; document.getElementById('photoPreviewImg').style.display = 'block'; document.getElementById('photoPlaceholder').style.display = 'none'; }
            }
            if (d.content) {
                document.getElementById('badge').value = d.content.badge || '';
                document.getElementById('mainTitle').value = d.content.mainTitle || '';
                document.getElementById('mainTitleEn').value = d.content.mainTitleEn || '';
                document.getElementById('subtitle').value = d.content.subtitle || '';
                document.getElementById('pointsList').innerHTML = '';
                (d.content.points || []).forEach(p => addPoint(p));
            }
            if (d.design) { selectTemplate(d.design.template || 1); selectColorScheme(d.design.colorScheme || 1); }
            if (d.brand) { document.getElementById('brandName').value = d.brand.name || 'HENGSHENG'; document.getElementById('brandTagline').value = d.brand.tagline || ''; }
            updatePreview();
            showToast('模板已加载', 'success');
        }

        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        // Utilities
        function showToast(msg, type = '') { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show ' + type; setTimeout(() => t.classList.remove('show'), 3000); }
        function showLoading(msg = '加载中...') { document.getElementById('loadingText').textContent = msg; document.getElementById('loadingOverlay').classList.add('show'); }
        function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }

        // Init
        function initUI() {
            // Templates
            const tg = document.getElementById('templateGrid');
            backgrounds.forEach((bg, i) => {
                const b = document.createElement('div');
                b.className = 'template-btn' + (i === 0 ? ' active' : '');
                b.dataset.template = i + 1;
                b.style.background = bg.gradient;
                b.innerHTML = `<span>${bg.name}</span>`;
                b.onclick = () => selectTemplate(i + 1);
                tg.appendChild(b);
            });

            // Color schemes
            const cs = document.getElementById('colorSchemes');
            for (let i = 1; i <= 6; i++) {
                const b = document.createElement('div');
                b.className = 'color-scheme-btn' + (i === 1 ? ' active' : '');
                b.dataset.scheme = i;
                b.onclick = () => selectColorScheme(i);
                cs.appendChild(b);
            }

            // Default date
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('meetingDate').value = tomorrow.toISOString().split('T')[0];

            // Mark user edited
            ['speakerNameEn', 'mainTitleEn'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', function() { this.dataset.userEdited = 'true'; });
            });

            // Batch options
            document.querySelectorAll('.batch-option').forEach(opt => { opt.onclick = () => opt.classList.toggle('selected'); });

            // Add initial items
            addAchievement();
            addPoint();

            updatePreview();
        }

        // Auth State
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loadingOverlay').classList.add('show');
            auth.onAuthStateChanged(async user => {
                document.getElementById('loadingOverlay').classList.remove('show');
                if (user) {
                    currentUser = user;
                    document.getElementById('authScreen').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'block';
                    document.getElementById('userEmail').textContent = user.email;
                    initUI();
                    await loadUserData();
                } else {
                    currentUser = null;
                    document.getElementById('authScreen').style.display = 'flex';
                    document.getElementById('appContainer').style.display = 'none';
                }
            });
        });

        document.querySelectorAll('.modal-overlay').forEach(m => { m.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); }); });
    </script>
</body>
</html>
